name: Recolectar telemetria de buses

# El cron de GitHub Actions es "mejor esfuerzo": retrasa o salta ejecuciones.
# Por eso cada ejecucion hace un bucle interno (un ciclo cada 10 min, ~5h40) y el cron
# solo la relanza cada 6 h. Si un disparo se atrasa, el siguiente cubre el hueco.
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch: {}        # permite correrlo a mano desde la pestaña Actions

concurrency:
  group: recolector
  cancel-in-progress: false    # si ya hay uno corriendo, el nuevo espera

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests redis
      - run: python collect.py
        env:
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          LOOP_MINUTES: "340"
          INTERVAL_MIN: "10"
